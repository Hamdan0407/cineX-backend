# Production profile configuration
spring.application.name=bookmyshow-prod

# Production database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookmyshow_prod}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# JPA production hardening
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP production pooling
spring.datasource.hikari.pool-name=CineX-Prod-HikariPool
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# Redis is mandatory in production because it owns distributed seat locks. The shared
# Lettuce factory resolves REDIS_URL before considering the local host/port fallback.
cinex.redis.required=true

# Razorpay credentials
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}

# Actuator & monitoring
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.bookmyshow=INFO
logging.level.org.hibernate.SQL=WARN
