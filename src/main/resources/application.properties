# Application
spring.application.name=bookmyshow
# Direct local launches use bookmyshow/.env. Container and shell environment variables
# still override these values, so Docker deployment behavior remains unchanged.
spring.config.import=optional:file:.env[.properties]
server.port=${SERVER_PORT:8081}

# Local PostgreSQL database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/bookmyshow}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# JPA
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.open-in-view=false

# HikariCP
spring.datasource.hikari.pool-name=CineX-HikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=60000

# Hibernate optimization
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# Redis configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
# Match the prod profile so a stalled Redis fails a request in seconds instead of parking a
# Tomcat thread on Lettuce's 60s default command timeout.
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2000ms}
cinex.seat-lock.backend=${SEAT_LOCK_BACKEND:redis}
cinex.seat-lock.hold-ttl=${SEAT_LOCK_HOLD_TTL:10m}
cinex.security.allow-test-auth-bypass=false

# Email configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
cinex.mail.from=${MAIL_FROM:}
cinex.mail.from-name=${MAIL_FROM_NAME:CineX}

# Abandoned checkout recovery
abandoned-checkout.recovery-delay-minutes=${ABANDONED_CHECKOUT_RECOVERY_DELAY_MINUTES:30}
abandoned-checkout.processor-interval-minutes=${ABANDONED_CHECKOUT_PROCESSOR_INTERVAL_MINUTES:10}
abandoned-checkout.frontend-url=${CINEX_FRONTEND_URL:http://localhost:5173}
abandoned-checkout.processor-enabled=${ABANDONED_CHECKOUT_PROCESSOR_ENABLED:true}

# CineX media delivery (S3 object keys resolved through CloudFront)
cinex.media.cloudfront-base-url=${CLOUDFRONT_MEDIA_BASE_URL:}
cinex.media.s3-bucket=${S3_MEDIA_BUCKET:cinex-trailer-media}
cinex.media.s3-region=${S3_MEDIA_REGION:us-east-1}
cinex.media.trailer-mappings.969681=trailers/SPIDER-MAN_ BRAND NEW DAY \u2013 New Trailer (4K).mp4
cinex.media.trailer-mappings.1003596=trailers/Avengers_ Doomsday _ Special Look _ In Theaters December 18.mp4
cinex.media.trailer-mappings.1170608=trailers/Dune_ Part Three _ Official Teaser Trailer - (1080p).mp4
cinex.media.trailer-mappings.1288445=trailers/Mutiny (2026) Official Trailer - Jason Statham - (1080p).mp4
cinex.media.trailer-mappings.1516698=trailers/The Last Sunrise - Official Trailer _ Prime Video.mp4
cinex.media.trailer-mappings.1368337=trailers/The Odyssey _ Official New Trailer.mp4

# TMDB configuration
tmdb.api.key=${TMDB_API_KEY:}
tmdb.base-url=${TMDB_BASE_URL:https://api.themoviedb.org/3}
tmdb.languages=${TMDB_LANGUAGES:hi,en,ta}

# Razorpay configuration
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}

# Clerk authentication configuration
cinex.admin.clerk-user-id=${ADMIN_CLERK_USER_ID:}
cinex.admin.email=${ADMIN_EMAIL:admin@cinex.com}
clerk.jwks-url=${CLERK_JWKS_URL:}
clerk.issuer=${CLERK_ISSUER:}

# Spring Boot Actuator & Prometheus metrics
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
# Seat locking depends on Redis, so /actuator/health must show it. This was disabled, which is why
# a dead Redis host port-forward surfaced only as a seat-lock toast. Liveness/readiness probe groups
# only include the application state indicators, so this does not flip container readiness.
management.health.redis.enabled=true
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.info.env.enabled=true
management.metrics.tags.application=cinex-backend
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true
