spring.datasource.url=jdbc:h2:mem:bookmyshow-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

tmdb.api.key=test-key
razorpay.key-id=test-key
razorpay.key-secret=test-secret

spring.data.redis.host=localhost
spring.data.redis.port=6379
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers
management.endpoint.health.show-details=always
management.health.redis.enabled=false
management.health.mail.enabled=false
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.export.prometheus.enabled=true

clerk.jwks-url=
clerk.issuer=https://test.clerk.dev
